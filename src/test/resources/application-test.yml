spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

app:
  openapi:
    enabled: true

jwt:
  secret: Y29udGV4dC1zdHQtdGVzdC1vbmx5LWp3dC1zZWNyZXQta2V5LTMyLWJ5dGVz
  access-token-validity-ms: 3600000

auth:
  rate-limit:
    maximum-tracked-keys: 20000
    signup:
      capacity: 10000
      window: 1m
    login:
      capacity: 10000
      window: 1m

stt:
  google:
    enabled: false
    project-id: test-project

claude:
  api:
    enabled: false

openrouter:
  api:
    enabled: false

context-analysis:
  guardrails:
    rate-limit:
      capacity: 10000
