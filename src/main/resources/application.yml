spring:
  application:
    name: backend

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:context_stt}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    clean-disabled: true
    validate-migration-naming: true

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false

springdoc:
  api-docs:
    enabled: ${app.openapi.enabled}
  swagger-ui:
    enabled: ${app.openapi.enabled}

app:
  openapi:
    enabled: false

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:3600000}

auth:
  rate-limit:
    maximum-tracked-keys: ${AUTH_RATE_LIMIT_MAXIMUM_TRACKED_KEYS:20000}
    signup:
      capacity: ${AUTH_RATE_LIMIT_SIGNUP_CAPACITY:5}
      window: ${AUTH_RATE_LIMIT_SIGNUP_WINDOW:1m}
    login:
      capacity: ${AUTH_RATE_LIMIT_LOGIN_CAPACITY:10}
      window: ${AUTH_RATE_LIMIT_LOGIN_WINDOW:1m}

stt:
  google:
    enabled: ${STT_GOOGLE_ENABLED:false}
    project-id: ${GOOGLE_CLOUD_PROJECT:}
    location: ${STT_GOOGLE_LOCATION:asia-northeast1}
    model: ${STT_GOOGLE_MODEL:long}
    max-audio-bytes: ${STT_MAX_AUDIO_BYTES:10485760}

claude:
  api:
    enabled: ${CLAUDE_API_ENABLED:false}
    api-key: ${CLAUDE_API_KEY:}
    base-url: ${CLAUDE_API_BASE_URL:https://api.anthropic.com}
    model: ${CLAUDE_API_MODEL:claude-sonnet-5}
    max-tokens: ${CLAUDE_API_MAX_TOKENS:1024}
    timeout-seconds: ${CLAUDE_API_TIMEOUT_SECONDS:30}
