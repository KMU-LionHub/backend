services:
  mysql:
    restart: always
    mem_limit: ${MYSQL_MEMORY_LIMIT:-1g}
    cpus: ${MYSQL_CPU_LIMIT:-1.0}

  backend:
    image: "${BACKEND_IMAGE_REPOSITORY:-ghcr.io/kmu-lionhub/backend}:${BACKEND_IMAGE_TAG:?BACKEND_IMAGE_TAG is required}"
    pull_policy: always
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      JPA_SHOW_SQL: "false"
      JPA_FORMAT_SQL: "false"
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"
    mem_limit: ${BACKEND_MEMORY_LIMIT:-1g}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
