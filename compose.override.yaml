services:
  mysql:
    restart: "no"
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    networks:
      - database
      - local-access

  backend:
    image: contextstt-backend:local
    build:
      context: .
    restart: "no"
    environment:
      SPRING_PROFILES_ACTIVE: local
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}
    ports:
      - "127.0.0.1:${SERVER_PORT:-8080}:8080"

networks:
  local-access:
