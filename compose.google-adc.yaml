services:
  backend:
    # File-backed Compose secrets preserve host ownership and permissions.
    user: "${GOOGLE_ADC_RUNTIME_USER:-spring:spring}"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/google_adc
    secrets:
      - google_adc

secrets:
  google_adc:
    file: "${GOOGLE_ADC_PATH:?GOOGLE_ADC_PATH is required when mounting Google ADC}"
