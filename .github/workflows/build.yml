name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Gradle build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          validate-wrappers: true

      - name: Build and test
        run: bash gradlew build --no-daemon --stacktrace

  publish-image:
    name: Publish commit image
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' # TEMP: testing deploy job, revert before merge
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/kmu-lionhub/backend
          tags: type=raw,value=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push commit image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image

      - name: Add image reference to summary
        run: |
          echo '### Published image' >> "$GITHUB_STEP_SUMMARY"
          echo '`ghcr.io/kmu-lionhub/backend:${{ github.sha }}`' >> "$GITHUB_STEP_SUMMARY"
          echo 'Digest: `${{ steps.image.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy via Docker Compose
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' # TEMP: testing deploy job, revert before merge
    needs: publish-image
    runs-on: self-hosted
    timeout-minutes: 15
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write production .env file
        run: |
          cat > .env <<'ENV_EOF'
          ${{ secrets.PROD_ENV_FILE }}
          ENV_EOF

      - name: Pull backend image
        env:
          BACKEND_IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.prod.yaml --env-file .env pull backend

      - name: Deploy with Docker Compose
        env:
          BACKEND_IMAGE_TAG: ${{ github.sha }}
        run: docker compose -f compose.yaml -f compose.prod.yaml --env-file .env up -d --remove-orphans

      - name: Remove production .env file
        if: always()
        run: rm -f .env

      - name: Clean up dangling images
        run: docker image prune -f
