services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Seoul
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root --password=\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-local}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      FLYWAY_BASELINE_ON_MIGRATE: ${FLYWAY_BASELINE_ON_MIGRATE:-true}
      JPA_SHOW_SQL: ${JPA_SHOW_SQL:-false}
      JPA_FORMAT_SQL: ${JPA_FORMAT_SQL:-false}
      AUTH_RATE_LIMIT_MAXIMUM_TRACKED_KEYS: ${AUTH_RATE_LIMIT_MAXIMUM_TRACKED_KEYS:-20000}
      AUTH_RATE_LIMIT_SIGNUP_CAPACITY: ${AUTH_RATE_LIMIT_SIGNUP_CAPACITY:-5}
      AUTH_RATE_LIMIT_SIGNUP_WINDOW: ${AUTH_RATE_LIMIT_SIGNUP_WINDOW:-1m}
      AUTH_RATE_LIMIT_LOGIN_CAPACITY: ${AUTH_RATE_LIMIT_LOGIN_CAPACITY:-10}
      AUTH_RATE_LIMIT_LOGIN_WINDOW: ${AUTH_RATE_LIMIT_LOGIN_WINDOW:-1m}
      STT_GOOGLE_ENABLED: ${STT_GOOGLE_ENABLED:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      STT_GOOGLE_LOCATION: ${STT_GOOGLE_LOCATION:-asia-northeast1}
      STT_GOOGLE_MODEL: ${STT_GOOGLE_MODEL:-long}
      STT_MAX_AUDIO_BYTES: ${STT_MAX_AUDIO_BYTES:-10485760}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_VALIDITY_MS: ${JWT_ACCESS_TOKEN_VALIDITY_MS}
      SERVER_PORT: 8080
      TZ: Asia/Seoul
    ports:
      - "${SERVER_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
